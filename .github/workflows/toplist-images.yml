name: Ảnh Top list

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Số địa điểm tối đa mỗi lần chạy"
        default: "60"

permissions:
  contents: write

concurrency:
  group: toplist-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gdown==5.2.0 pillow==11.0.0
      - name: Lấy ảnh đại diện từ Google Drive
        run: python3 scripts/toplist-images.py "${{ github.event.inputs.limit }}"
      - name: Lưu vào repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add data/toplist.json data/toplist-img || true
          git diff --cached --quiet && exit 0
          git commit -m "Top list: thêm ảnh đại diện"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 5; done
