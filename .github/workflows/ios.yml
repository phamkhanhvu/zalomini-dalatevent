# Build gói website tĩnh (web/) rồi biên dịch thử app iOS bằng Xcode (máy ảo, chưa ký).
# Gói website đã build được lưu lại ở mục Artifacts của mỗi lần chạy, tải về là đưa lên máy chủ được.
# Khi đã có tài khoản Apple Developer, thêm bước ký và tải lên TestFlight (xem ios-app/README.md).
name: Web và app iOS

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
      - "ios-app/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: web-ios-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/validate-events.mjs
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: dalatevent-web
          path: web/dist
          retention-days: 30
      # Bản dùng cho dalatevent.com: tải dữ liệu mới từ thư mục data/ của repo, đưa lên nhánh "site".
      # Trang chủ dalatevent.com nạp JS/CSS từ một commit cố định của nhánh này (qua cdn.jsdelivr.net).
      - name: Build bản cho dalatevent.com
        working-directory: web
        env:
          VITE_DATA_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/data/
          VITE_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: npx vite build --outDir ../site-dist --emptyOutDir
      - name: Đưa lên nhánh site
        # Thêm commit mới, KHÔNG ghi đè lịch sử: trang chủ đang trỏ tới một commit cụ thể của nhánh này,
        # commit đó phải còn tồn tại thì JS/CSS mới tải được.
        run: |
          git clone -q --depth 1 --branch site "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site-branch
          cd site-branch
          git rm -rq . && cp -r ../site-dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Không có thay đổi giao diện."; else
            git commit -q -m "Site build từ ${GITHUB_SHA::7}"
            git push -q origin site
          fi
          echo "Commit nhánh site hiện tại: $(git rev-parse HEAD)"
          grep -o 'assets/index-[^"]*' index.html

  ios:
    needs: web
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: dalatevent-web
          path: web/dist
      - run: npm ci
        working-directory: ios-app
      - run: npx cap sync ios
        working-directory: ios-app
      - name: Biên dịch cho máy ảo iPhone
        working-directory: ios-app
        run: |
          xcodebuild -version
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 25
      - name: Chạy thử app trên máy ảo iPhone và chụp màn hình
        working-directory: ios-app
        run: |
          APP=$(find build/Build/Products -name "App.app" -maxdepth 3 | head -1)
          test -d "$APP" || { echo "Không tìm thấy App.app"; exit 1; }
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')]; pro=[x for x in c if 'Pro Max' in x['name']] or c; print(pro[-1]['udid'])")
          xcrun simctl list devices available | grep "$DEV" || true
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" vn.sensegroup.dalatevent
          mkdir -p shots
          sleep 30
          xcrun simctl io "$DEV" screenshot shots/01-mo-app.png
          sleep 12
          xcrun simctl io "$DEV" screenshot shots/02-sau-12-giay.png
          # App còn sống sau khi mở (không bị văng)
          xcrun simctl spawn "$DEV" launchctl list | grep -i "vn.sensegroup.dalatevent" || { echo "App không còn chạy sau khi mở"; exit 1; }
          xcrun simctl shutdown "$DEV"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-may-ao-anh-chup
          path: ios-app/shots
          retention-days: 14
